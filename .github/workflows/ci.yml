name: DevOps CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  run-hello:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run hello application
        run: python hello.py

      - name: Run Linux system information script
        run: bash scripts/sysinfo.sh
